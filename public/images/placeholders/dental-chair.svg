<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Placeholder render of a dental chair on a studio stage">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#2B322F"/>
      <stop offset="62%" stop-color="#202522"/>
      <stop offset="100%" stop-color="#191D1B"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.58" cy="0.28" r="0.62">
      <stop offset="0%" stop-color="#5E7E78" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#202522" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chair" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#F1EDE5"/>
      <stop offset="100%" stop-color="#CFC9BE"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B6BEB8"/>
      <stop offset="100%" stop-color="#7A837D"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#spot)"/>

  <!-- floor -->
  <ellipse cx="600" cy="742" rx="330" ry="46" fill="#0E1110" opacity="0.55" filter="url(#soft)"/>

  <g transform="translate(600 0)">
    <!-- base -->
    <ellipse cx="0" cy="700" rx="132" ry="26" fill="url(#metal)"/>
    <rect x="-24" y="470" width="48" height="232" rx="14" fill="url(#metal)"/>
    <!-- seat -->
    <rect x="-126" y="446" width="252" height="46" rx="20" fill="url(#chair)"/>
    <!-- backrest -->
    <g transform="rotate(-14)">
      <rect x="-118" y="238" width="236" height="216" rx="26" fill="url(#chair)"/>
    </g>
    <!-- headrest -->
    <g transform="rotate(-14)">
      <rect x="-62" y="170" width="124" height="72" rx="26" fill="url(#chair)"/>
    </g>
    <!-- armrest -->
    <rect x="-146" y="424" width="26" height="20" rx="9" fill="#2B322F"/>
    <rect x="120" y="424" width="26" height="20" rx="9" fill="#2B322F"/>
    <!-- delivery arm -->
    <path d="M120 430 L188 300 L214 268" stroke="url(#metal)" stroke-width="13" fill="none" stroke-linecap="round"/>
    <rect x="192" y="238" width="70" height="42" rx="10" fill="#2B322F"/>
    <!-- light arm -->
    <path d="M-120 420 L-158 250" stroke="url(#metal)" stroke-width="11" fill="none" stroke-linecap="round"/>
    <ellipse cx="-166" cy="232" rx="42" ry="20" transform="rotate(-24 -166 232)" fill="#2B322F"/>
    <ellipse cx="-166" cy="240" rx="26" ry="11" transform="rotate(-24 -166 240)" fill="#FFF6DC"/>
    <!-- footrest -->
    <rect x="-94" y="486" width="188" height="26" rx="12" fill="url(#chair)" transform="rotate(12)"/>
    <!-- accent -->
    <rect x="-104" y="452" width="208" height="8" rx="4" fill="#2F7772"/>
  </g>

  <text x="600" y="842" text-anchor="middle" font-family="Manrope, Inter, sans-serif" font-size="21" letter-spacing="4" fill="#929A94" fill-opacity="0.85">PLACEHOLDER MODEL — NOT FINAL EQUIPMENT</text>
</svg>
