<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Placeholder render of a phantom head training unit on a studio stage">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#F8F7F3"/>
      <stop offset="62%" stop-color="#F2F0E9"/>
      <stop offset="100%" stop-color="#E7EEE8"/>
    </linearGradient>
    <linearGradient id="bench" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E2DCD1"/>
      <stop offset="100%" stop-color="#CFC8BB"/>
    </linearGradient>
    <linearGradient id="shell" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#F4F7F6" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#CBD8D4" stop-opacity="0.82"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <ellipse cx="600" cy="672" rx="280" ry="34" fill="#8C958F" opacity="0.22" filter="url(#soft)"/>

  <g transform="translate(600 0)">
    <!-- bench -->
    <rect x="-300" y="596" width="600" height="20" rx="6" fill="url(#bench)"/>
    <rect x="-272" y="616" width="18" height="42" rx="4" fill="#C3BCAF"/>
    <rect x="254" y="616" width="18" height="42" rx="4" fill="#C3BCAF"/>

    <!-- clamp column -->
    <rect x="-16" y="500" width="32" height="96" rx="8" fill="#9AA39D"/>
    <circle cx="0" cy="492" r="22" fill="#2B322F"/>
    <rect x="-9" y="430" width="18" height="62" rx="6" fill="#9AA39D"/>

    <!-- neck -->
    <path d="M-24 430 Q-30 396 -20 372 L20 372 Q30 396 24 430 Z" fill="#E4E7E5"/>

    <!-- cranium -->
    <ellipse cx="0" cy="292" rx="98" ry="112" fill="url(#shell)" stroke="#B4C4C0" stroke-width="3"/>
    <!-- jaw -->
    <ellipse cx="0" cy="374" rx="76" ry="62" fill="#F0EDE6" stroke="#D2CCC1" stroke-width="2"/>
    <!-- arches -->
    <path d="M-62 300 Q0 244 62 300" stroke="#FBF8F2" stroke-width="15" fill="none" stroke-linecap="round"/>
    <path d="M-58 344 Q0 296 58 344" stroke="#FBF8F2" stroke-width="14" fill="none" stroke-linecap="round"/>
    <!-- face marker -->
    <rect x="-11" y="286" width="22" height="16" rx="4" fill="#2F7772"/>
  </g>

  <text x="600" y="812" text-anchor="middle" font-family="Manrope, Inter, sans-serif" font-size="21" letter-spacing="4" fill="#68716C">PLACEHOLDER MODEL — NOT FINAL EQUIPMENT</text>
</svg>
